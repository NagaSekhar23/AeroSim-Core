name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp:
    name: C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build with project warnings
        run: cmake --build build --parallel 2
      - name: Run CTest
        run: ctest --test-dir build --output-on-failure

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements-lock.txt
      - name: Create isolated environment and install analysis dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r python/requirements-lock.txt
      - name: Build experiment runner and generate test telemetry
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target aerosim_experiments --parallel 2
          ./build/aerosim_experiments --output-dir telemetry/my-run --fault-time 0.75
      - name: Run Python unit tests
        run: AEROSIM_EXPERIMENTS=./build/aerosim_experiments .venv/bin/python -m unittest discover -s python/tests -v
